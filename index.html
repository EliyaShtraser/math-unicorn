function home(){const completed=progress(),next=lessons.find(l=>!lessonDone(l))||lessons[0];return `<div class="hero"><div><div class="eyebrow"><span aria-hidden="true">✦</span> מועדון המתמטיקה שלך</div><h1>לומדות חשבון.<br><em>מגלות את הקסם.</em></h1><p>חדי קרן, קשתות ועשרה נושאים שתוכלי להבין בעצמך. בחרי שיעור, שחקי עם ההמחשה ותרגלי בקצב שלך.</p><div class="actions"><a class="primary" href="#lesson/${next.id}">${completed?'ממשיכות מהשיעור הבא':'בואי נתחיל ללמוד'} <span>←</span></a><a class="secondary" href="#test">אני מוכנה למבדק</a></div><div class="chips" style="margin-top:22px"><span class="chip">10 שיעורים קצרים</span><span class="chip">60 תרגילים עם הסבר</span><span class="chip">בלי שעון ובלי לחץ</span></div></div><div class="hero-art">${heroArt()}<span class="art-caption">🌈 בכל צעד, קצת יותר בטוחה</span></div></div><div class="progress-box"><div class="progress-number">${completed}<span class="small muted"> / 10</span></div><div class="track"><strong>הכוכבים שכבר אספת ✨</strong><div class="small muted">כוכב לכל שיעור: קוראות את ההסבר ופותרות נכון את 6 התרגילים. אפשר לנסות שוב כמה שרוצים.</div><div class="track-bar"><span style="width:${completed*10}%"></span></div></div><span aria-hidden="true" class="star-charm">✦</span></div><div class="section-heading"><h2>מה נלמד היום?</h2><span class="small muted">מומלץ להתחיל לפי הסדר. אפשר גם לבחור נושא.</span></div><div class="grid">${lessons.map((l,i)=>{const n=l.questions.filter((_,j)=>state.practice[`${l.id}-${j}`]?.correct).length;return `<a class="card" href="#lesson/${l.id}"><div class="card-top"><span class="card-icon" aria-hidden="true">${l.icon}</span><span class="small muted">${String(i+1).padStart(2,'0')} / 10</span></div><h3>${l.title}</h3><p>${l.desc}</p><div class="card-bottom"><span>${lessonDone(l)?'✓ השלמת את השיעור':n?`${n} מתוך 6 תרגילים נפתרו`:'הסבר + המחשה + תרגול'}</span><span class="arrow">←</span></div></a>`;}).join('')}</div><div class="plan"><h3>תוכנית פשוטה לארבעה מפגשים</h3><p class="small muted">כל מפגש: כ־30–40 דקות, לפי הקצב שלך. אפשר לפצל ולהוסיף הפסקות.</p><div class="plan-grid"><div><strong>מפגש 1 · הבסיס</strong>מבנה עשרוני, סדר פעולות וחשבון בשלמים.</div><div><strong>מפגש 2 · שברים</strong>ראשוני ופריק, ואז חיבור, חיסור וכפל בשברים.</div><div><strong>מפגש 3 · עשרוניים</strong>מכירות מספר עשרוני ומתרגלות חיבור וחיסור.</div><div><strong>מפגש 4 · גאומטריה</strong>משולשים, שטחים ומרובעים. אחר כך אפשר לגשת למבדק.</div></div></div><div class="test-banner"><div><h2>מוכנה לחבר את כל החלקים?</h2><p>מבדק של 20 שאלות, ואחריו הסברים והמלצה אישית לחזרה.</p></div><a class="primary" href="#test">למבדק המסכם ←</a></div>`;}
function quadTable(){return `<div class="scroll-table"><table><caption class="small" style="text-align:right;margin-bottom:8px">תכונות שמתקיימות תמיד בצורות האלה</caption><thead><tr><th>צורה</th><th>צלעות</th><th>זוויות</th><th>אלכסונים</th></tr></thead><tbody><tr><td>מקבילית</td><td>נגדיות שוות ומקבילות</td><td>נגדיות שוות</td><td>חוצים זה את זה</td></tr><tr><td>מלבן</td><td>נגדיות שוות ומקבילות</td><td>4 ישרות</td><td>שווים וחוצים זה את זה</td></tr><tr><td>מעוין</td><td>4 שוות; נגדיות מקבילות</td><td>נגדיות שוות</td><td>מאונכים וחוצים זה את זה</td></tr><tr><td>ריבוע</td><td>4 שוות; נגדיות מקבילות</td><td>4 ישרות</td><td>שווים, מאונכים וחוצים זה את זה</td></tr><tr><td>טרפז (כאן)</td><td>בדיוק זוג אחד מקבילות</td><td>אין חובה לזוויות ישרות</td><td>לא חייבים להיות שווים או מאונכים</td></tr><tr><td>דלתון</td><td>2 זוגות סמוכות שוות</td><td>לפחות זוג אחד נגדיות שוות</td><td>מאונכים; לפחות אחד חוצה את השני</td></tr></tbody></table></div>`;}
function stepsHTML(l){return l.steps.map((s,i)=>`<div class="step"><span class="step-no">${i+1}</span><div><h3>${s[0]}</h3><div>${s[1]}</div></div></div>`).join('')+(l.id==='quads'?quadTable():'');}
function lessonView(l){const ix=lessons.indexOf(l);return `<div class="breadcrumb"><a href="#home">המסלול שלי</a> / שיעור ${ix+1}</div><div class="lesson-head"><div><span class="eyebrow">שיעור ${String(ix+1).padStart(2,'0')} • כ־10–15 דקות</span><div class="lesson-heading-row"><span class="lesson-sticker" aria-hidden="true">${l.icon}</span><h1>${l.title}</h1></div><p>${l.goal}</p></div><span class="chip">${lessonDone(l)?'✨ השיעור הושלם':'לומדות צעד צעד'}</span></div><div class="tabs" role="tablist" aria-label="חלקי השיעור"><button role="tab" aria-selected="${currentTab==='learn'}" class="${currentTab==='learn'?'active':''}" data-tab="learn">1. מבינות ומגלות</button><button role="tab" aria-selected="${currentTab==='practice'}" class="${currentTab==='practice'?'active':''}" data-tab="practice">2. מנסות לבד</button></div>${currentTab==='learn'?`<div class="learn-layout"><section class="panel" aria-label="הסבר השיעור">${stepsHTML(l)}<div class="tip"><strong>טיפ מנצנץ ✨</strong><br>${l.tip.includes('<')?l.tip:mathProse(l.tip)}</div><div class="actions" style="margin-top:25px"><button class="primary" data-read="${l.id}">הבנתי, בואי נתרגל ←</button></div></section><aside>${labHTML(l.lab)}<section class="panel"><h3>איך לומדות כאן?</h3><p class="small">קראי חלק אחד בכל פעם. לפני שאת מסתכלת בתוצאה של דוגמה, נסי לפתור בעצמך על דף. אחרי ההמחשה, עברי לששת התרגילים.</p><p class="small muted">טעות היא רמז למה כדאי לבדוק שוב. ההסבר יעזור לך לנסות מחדש.</p></section></aside></div>`:`<div class="answer-format">בתרגילי הקלדה כתבי מספר בלי יחידה. שבר אפשר לכתוב כך: ${m('3/4')}, ומספר מעורב כך: ${m('1 1/2')}. במספר עשרוני השתמשי בנקודה: ${m('2.5')}. גם שברים שווים מתקבלים.</div>${l.questions.map((question,i)=>questionHTML(`${l.id}-${i}`,question,i+1,'practice')).join('')}<div class="actions"><button class="secondary" data-tab="learn">חוזרת להסבר</button><a class="primary" href="${ix<9?'#lesson/'+lessons[ix+1].id:'#test'}">${ix<9?'לשיעור הבא ←':'למבדק המסכם ←'}</a></div>`}`;}
function answerDisplay(question){return question.options?esc(question.answer):m(esc(question.answer));}
function questionHTML(id,question,index,mode){const record=mode==='practice'?state.practice[id]:null,raw=mode==='test'?(state.exam?.answers[id]||''):(drafts[id]??record?.raw??''),selected=mode==='test'?raw:(selections[id]??raw),finished=mode==='review';let feedback='';if(record){feedback=record.revealed?`<div class="feedback neutral" role="status"><strong>נלמד מהפתרון:</strong> ${answerDisplay(question)}<p>${question.explain}</p><p>כדי לתרגל בעצמך, סגרי את הפתרון ונסי שוב.</p><button class="text-btn" data-retry="${id}">סוגרת ומנסה לבד</button></div>`:`<div class="feedback ${record.correct?'good':'bad'}" role="status"><strong>${record.correct?'✨ נכון מאוד!':'עדיין לא. בואי נבדוק יחד.'}</strong><p>${question.explain}</p>${record.correct?'':`<p>התשובה הנכונה: ${answerDisplay(question)}</p>`}</div>`;}
const reviewRaw=finished?(state.exam.answers[id]||''):null;
return `<article class="q-card" id="q-${id}"><div class="q-top"><span>שאלה ${index}</span>${mode!=='practice'?`<span>${lessons.find(l=>l.id===id.slice(0,id.lastIndexOf('-')))?.title||''}</span>`:''}</div><div class="q-prompt" id="label-${id}">${question.prompt}</div>${finished?`<div class="feedback ${isCorrect(question,reviewRaw)?'good':'bad'}"><strong>${isCorrect(question,reviewRaw)?'✓ תשובה נכונה':'כדאי לחזור על זה'}</strong><p>התשובה שלך: ${esc(reviewRaw)} · התשובה הנכונה: ${answerDisplay(question)}</p><p>${question.explain}</p></div>`:`${question.options?`<div class="options" role="group" aria-labelledby="label-${id}">${question.options.map((o,i)=>`<button class="option ${selected===o?'selected':''}" data-option="${id}" data-choice="${i}" data-mode="${mode}" aria-pressed="${selected===o}" ${record?.correct?'disabled':''}>${/^[\d.,/ ×÷+−=()°-]+$/.test(o)?m(esc(o)):esc(o)}</button>`).join('')}</div>`:`<input type="text" inputmode="${lessons.find(l=>l.id==='fractions'&&id.startsWith(l.id+'-'))?'text':'decimal'}" autocomplete="off" aria-labelledby="label-${id}" placeholder="התשובה שלך" value="${esc(raw)}" data-answer="${id}" data-mode="${mode}" ${record?.correct?'disabled':''}>`}<div class="error" id="error-${id}" role="alert"></div>${mode==='practice'?`<div class="actions"><button class="primary" data-check="${id}" ${record?.correct?'disabled':''}>${record?.correct?'✓ פתרת נכון':'בדיקת תשובה'}</button>${!record?.correct?`<button class="text-btn" data-reveal="${id}">אני צריכה לראות פתרון</button>`:''}</div>${feedback}`:''}`}</article>`;}
function labHTML(type){const shell=(title,body)=>`<section class="panel lab"><span class="eyebrow">✦ מגלות בידיים</span><h3>${title}</h3>${body}</section>`;switch(type){
case 'place':return shell('המקום משנה את הערך',`<label for="place-number">כתבי מספר שלם מ־0 עד 999,999</label><input id="place-number" type="number" min="0" max="999999" step="1" value="35472"><div id="lab-output"></div>`);
case 'prime':return shell('בלשית המחלקים',`<label for="prime-number">בחרי מספר מ־1 עד 100</label><input id="prime-number" type="number" min="1" max="100" step="1" value="18"><div id="lab-output"></div>`);
case 'fractions':return shell('בונות שבר',`<p class="small">שני את מספר החלקים ואת מספר החלקים הצבועים. מה השבר שמתקבל?</p><label for="frac-den">מספר חלקים שווים: <output id="frac-den-v">8</output></label><input id="frac-den" type="range" min="2" max="12" value="8"><label for="frac-num">חלקים צבועים: <output id="frac-num-v">3</output></label><input id="frac-num" type="range" min="0" max="8" value="3"><div id="lab-output"></div>`);
case 'decimal':return shell('ממלאות מאיות',`<p class="small">הריבוע הגדול הוא שלם אחד, שמחולק ל־100 ריבועים שווים.</p><label for="decimal-range">כמה מאיות נצבע?</label><input id="decimal-range" type="range" min="0" max="100" value="35"><div id="lab-output"></div>`);
case 'area':return shell('בסיס, גובה ושטח',`<label for="area-base">בסיס: <output id="area-base-v">8</output> ס״מ</label><input id="area-base" type="range" min="2" max="12" value="8"><label for="area-height">גובה: <output id="area-height-v">5</output> ס״מ</label><input id="area-height" type="range" min="2" max="9" value="5"><div id="lab-output"></div><p class="small">אותו בסיס ואותו גובה: שטח המשולש הוא חצי משטח המלבן שמסביבו.</p>`);
case 'triangles':return shell('מסתכלות בשתי דרכים',`<label for="triangle-select">בחרי משולש</label><select id="triangle-select" dir="rtl"><option value="equal">שווה־צלעות</option><option value="right">שווה־שוקיים וישר־זווית</option><option value="obtuse">שונה־צלעות וקהה־זווית</option></select><div id="lab-output"></div>`);
case 'quads':return shell('כל צורה והתכונות שלה',`<label for="quad-select">בחרי מרובע</label><select id="quad-select" dir="rtl"><option value="square">ריבוע</option><option value="rectangle">מלבן</option><option value="rhombus">מעוין</option><option value="parallel">מקבילית</option><option value="trapezoid">טרפז</option><option value="kite">דלתון</option></select><div id="lab-output"></div>`);
case 'order':return shell('אותם מספרים, סדר אחר',`<p class="small">מה משתנה כשמוסיפים סוגריים?</p><label for="order-select">בחרי תרגיל</label><select id="order-select"><option value="no">7 + 3 × 4</option><option value="yes">(7 + 3) × 4</option></select><div id="lab-output"></div>`);
case 'whole':return shell('חוקרות כפל',`<label for="whole-a">מספר שורות: <output id="whole-a-v">3</output></label><input id="whole-a" type="range" min="1" max="8" value="3"><label for="whole-b">בכל שורה: <output id="whole-b-v">4</output></label><input id="whole-b" type="range" min="1" max="10" value="4"><div id="lab-output"></div>`);
case 'decimal-ops':return shell('נקודה מתחת לנקודה',`<p class="small">שני את המספר הראשון ובדקי איך האפסים עוזרים ליישר את הטורים.</p><label for="decimal-op-select">בחרי מספר לחיבור עם 1.27</label><select id="decimal-op-select"><option value="3.5">3.5</option><option value="3.05">3.05</option><option value="3">3</option></select><div id="lab-output"></div>`);
}}
function svg(content,box='0 0 300 210',label='המחשה'){return `<svg viewBox="${box}" role="img" aria-label="${label}">${content}</svg>`;}
function initLab(){const out=document.getElementById('lab-output');if(!out)return;const val=id=>+document.getElementById(id).value;const l=lessons.find(l=>location.hash===`#lesson/${l.id}`);if(!l)return;switch(l.lab){case 'place':{const n=val('place-number');if(!Number.isInteger(n)||n<0||n>999999){out.innerHTML='<p>בחרי מספר שלם בטווח שמופיע למעלה.</p>';break;}const digits=String(n).padStart(6,'0').split(''),names=['מאות אלפים','עשרות אלפים','אלפים','מאות','עשרות','יחידות'];out.innerHTML=`<div class="scroll-table" style="margin-top:20px"><table><tbody>${digits.map((d,i)=>`<tr><th>${names[i]}</th><td>${d}</td><td>${m((+d*10**(5-i)).toLocaleString('en-US'))}</td></tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:15px">כל מעבר מקום שמאלה מכפיל את הערך ב־10.</p>`;break;}
case 'prime':{const n=val('prime-number');if(!Number.isInteger(n)||n<1||n>100){out.innerHTML='<p>בחרי מספר שלם מ־1 עד 100.</p>';break;}const ds=Array.from({length:n},(_,i)=>i+1).filter(x=>n%x===0);out.innerHTML=`<p style="margin-top:20px">המחלקים החיוביים: ${m(ds.join(', '))}</p><div class="lab-result">${n===1?'1 אינו ראשוני ואינו פריק':ds.length===2?`${n} הוא מספר ראשוני`:`${n} הוא מספר פריק`}</div><p class="small">מצאנו ${ds.length} ${ds.length===1?'מחלק חיובי':'מחלקים חיוביים'}.</p>`;break;}
case 'fractions':{let d=val('frac-den'),n=val('frac-num');const slider=document.getElementById('frac-num');slider.max=d;if(n>d){n=d;slider.value=d;}document.getElementById('frac-den-v').textContent=d;document.getElementById('frac-num-v').textContent=n;out.innerHTML=svg(Array.from({length:d},(_,i)=>`<rect x="${10+i*280/d}" y="50" width="${280/d}" height="65" fill="${i<n?'#7651b2':'white'}" stroke="#b59acc"/>`).join(''),'0 0 300 150',`${n} מתוך ${d} חלקים צבועים`)+`<div class="lab-result">${m(`${f(n,d)} = ${(n/d).toFixed(3).replace(/\.?0+$/,'')||'0'}`)}</div><p class="small">הכתיבה העשרונית מוצגת כאן עד 3 ספרות אחרי הנקודה, ולעיתים מעוגלת.</p>`;break;}
case 'decimal':{const n=val('decimal-range');out.innerHTML=svg(Array.from({length:100},(_,i)=>`<rect x="${50+i%10*20}" y="${Math.floor(i/10)*20}" width="20" height="20" fill="${i<n?'#7651b2':'white'}" stroke="#baa3ce"/>`).join(''),'0 0 300 205',`${n} מאיות צבועות`)+`<div class="lab-result">${m(`${f(n,100)} = ${(n/100).toFixed(2)}`)}</div>`;break;}
case 'area':{const b=val('area-base'),h=val('area-height'),w=b*20,hh=h*17,x=(300-w)/2,y=185-hh;document.getElementById('area-base-v').textContent=b;document.getElementById('area-height-v').textContent=h;out.innerHTML=svg(`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#f0e4fa" stroke="#c9b0dc" stroke-dasharray="5 4"/><path d="M${x} 185L${x+w*.65} ${y}L${x+w} 185Z" fill="#f6d8e8" stroke="#7651b2" stroke-width="2"/><path d="M${x+w*.65} ${y}V185" stroke="#7651b2" stroke-width="2" stroke-dasharray="4 4"/><path d="M${x+w*.65} 175h10v10" fill="none" stroke="#7651b2"/><text x="150" y="207" text-anchor="middle" font-size="14">${b} cm</text><text x="${x+w*.65+15}" y="${y+hh/2}" font-size="14">${h} cm</text>`,'0 0 300 220','משולש בתוך מלבן עם גובה מאונך לבסיס')+`<div class="lab-result">${m(`${b} × ${h} ÷ 2 = ${b*h/2}`)} סמ״ר</div><p class="small">שטח המלבן: ${b*h} סמ״ר.</p>`;break;}
case 'triangles':{const v=document.getElementById('triangle-select').value;const data={equal:['M60 170L240 170L150 14Z','60°, 60°, 60°','שווה־צלעות וחד־זוויות'],right:['M65 35V170H200Z','45°, 45°, 90°','שווה־שוקיים וישר־זווית'],obtuse:['M35 170L265 170L90 120Z','זווית אחת גדולה מ־90°','שונה־צלעות וקהה־זווית']}[v];out.innerHTML=svg(`<path d="${data[0]}" fill="#f5d3e7" stroke="#7651b2" stroke-width="3"/>${v==='right'?'<path d="M65 157h13v13" fill="none" stroke="#7651b2" stroke-width="2"/>':''}`)+`<div class="lab-result">${data[2]}</div><p class="small" style="text-align:center">${m(data[1])}</p><p class="small">האורכים והזוויות נקבעים לפי הנתונים. הציור הוא להמחשה.</p>`;break;}
case 'quads':{const v=document.getElementById('quad-select').value;const data={square:['70,25 220,25 220,175 70,175','4 צלעות שוות ו־4 זוויות ישרות. גם מלבן, גם מעוין וגם מקבילית.'],rectangle:['40,55 260,55 260,160 40,160','4 זוויות ישרות. צלעות נגדיות שוות ומקבילות.'],rhombus:['55,105 150,35 245,105 150,175','4 צלעות שוות. צלעות נגדיות מקבילות.'],parallel:['70,45 260,45 220,165 30,165','שני זוגות של צלעות נגדיות מקבילות ושוות.'],trapezoid:['95,45 205,45 265,170 35,170','בדיוק זוג אחד של צלעות נגדיות מקבילות, לפי ההגדרה במסלול.'],kite:['150,20 240,85 150,185 60,85','שני זוגות של צלעות סמוכות שוות.']}[v];out.innerHTML=svg(`<polygon points="${data[0]}" fill="#dccaef" stroke="#7651b2" stroke-width="3"/>`)+`<p class="small">${data[1]}</p>`;break;}

case 'whole':{const a=val('whole-a'),b=val('whole-b');document.getElementById('whole-a-v').textContent=a;document.getElementById('whole-b-v').textContent=b;out.innerHTML=svg(Array.from({length:a*b},(_,i)=>`<circle cx="${(300-b*23)/2+i%b*23+11}" cy="${25+Math.floor(i/b)*23}" r="8" fill="#7651b2"/>`).join(''),'0 0 300 210',`${a} שורות ובכל שורה ${b} נקודות`)+`<div class="lab-result">${m(`${a} × ${b} = ${a*b}`)}</div>`;break;}
case 'decimal-ops':{const n=+document.getElementById('decimal-op-select').value;out.innerHTML=`<div class="equation-col">  ${n.toFixed(2)}\n+ 1.27\n──────\n  ${(n+1.27).toFixed(2)}</div><p class="small">הנקודה נמצאת באותו טור בכל שורה. האפסים שהוספנו בסוף אינם משנים את המספר.</p>`;break;}}
}
function newExam(){const ids=[];for(const l of lessons){const pool=l.questions.map((_,i)=>i);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}pool.slice(0,2).forEach(i=>ids.push(`${l.id}-${i}`));}state.exam={ids,answers:{},submitted:false};save();}
function examIsValid(){return state.exam&&Array.isArray(state.exam.ids)&&state.exam.ids.length===20&&state.exam.ids.every(id=>getQ(id))&&state.exam.answers&&typeof state.exam.answers==='object';}
function testView(){if(!examIsValid())return `<section class="test-intro"><span class="eyebrow">מחברות את כל מה שלמדת</span><h1>המבדק שלך.<br>בקצב שלך.</h1><p>20 שאלות, שתי שאלות מכל נושא. אפשר לכתוב טיוטה על דף, לחשוב ולשנות תשובות לפני שמסיימות.</p><div class="panel"><h3>איך זה עובד?</h3><ul><li>כל שאלה שווה נקודה אחת. אין הגבלת זמן.</li><li>את הפתרונות וההסברים תראי בסיום המבדק.</li><li>בסוף תקבלי ציון והמלצה על הנושאים שכדאי לתרגל עוד.</li><li>זהו מבדק תרגול; המבדק בבית הספר עשוי לכלול שאלות נוספות.</li></ul></div><button class="primary" id="start-test">מתחילה את המבדק ←</button></section>`;
const e=state.exam;if(e.submitted){const score=e.ids.filter(id=>isCorrect(getQ(id),e.answers[id])).length;const rows=lessons.map(l=>{const ids=e.ids.filter(id=>id.slice(0,id.lastIndexOf('-'))===l.id);return {l,score:ids.filter(id=>isCorrect(getQ(id),e.answers[id])).length};});const revise=rows.filter(r=>r.score<2);return `<div class="breadcrumb"><a href="#home">המסלול שלי</a> / תוצאות המבדק</div><section class="panel"><span class="eyebrow">כל הכבוד על ההתמדה</span><h1 style="font-size:38px">עכשיו יודעות מה הצעד הבא.</h1><div class="result-score">${score}<span class="muted" style="font-size:26px"> / 20</span></div><p>${score*5}% · כל תשובה נכונה שווה 5 נקודות בציון מתוך 100.</p><p>${score===20?'פתרת נכון את כל השאלות במבדק הזה! תוכלי להמשיך לתרגל עם שאלות נוספות.':'מומלץ לחזור להסברים בנושאים שבהם הייתה טעות, ואז לנסות תרגילים נוספים.'}</p><div class="topic-results">${rows.map(r=>`<a class="topic-result" href="#lesson/${r.l.id}"><strong>${r.l.title}</strong><br><span class="small">${m(`${r.score}/2`)} תשובות נכונות · ${r.score===2?'יפה מאוד ✓':'לחזרה ותרגול ←'}</span></a>`).join('')}</div>${revise.length?`<p class="small">המלצה להתחלה: <a class="inline-link" href="#lesson/${revise.sort((a,b)=>a.score-b.score)[0].l.id}">${revise[0].l.title}</a>. שתי שאלות נותנות כיוון לחזרה; הן לא בודקות את כל מה שאת יודעת בנושא.</p>`:''}<div class="actions"><button class="primary" id="new-test">מבדק חדש עם בחירת שאלות מחדש</button><a class="secondary" href="#home">חוזרת למסלול שלי</a></div><p class="small muted" style="margin-top:12px">חלק מהשאלות עשויות לחזור. התחלת מבדק חדש מחליפה את התוצאה השמורה כאן.</p></section><h2>עוברות יחד על התשובות</h2>${e.ids.map((id,i)=>questionHTML(id,getQ(id),i+1,'review')).join('')}`;}
const answered=e.ids.filter(id=>answerValid(getQ(id),e.answers[id]||'')).length;return `<div class="breadcrumb"><a href="#home">המסלול שלי</a> / מבדק מסכם</div><div class="lesson-head"><div><span class="eyebrow">20 שאלות • ללא הגבלת זמן</span><h1>מנסות, חושבות, בודקות.</h1><p>אפשר לשנות תשובה עד הלחיצה על ״סיימתי, בדקי לי״. ההתקדמות נשמרת אוטומטית במכשיר הזה.</p></div></div><div class="answer-format">מספרים מקלידות בלי יחידות. שבר: ${m('3/4')}; מספר מעורב: ${m('1 1/2')}; מספר עשרוני: ${m('2.5')}. הפתרונות יופיעו בסיום.</div>${e.ids.map((id,i)=>questionHTML(id,getQ(id),i+1,'test')).join('')}<div id="test-error" class="error" role="alert"></div><div class="test-submit"><span id="answered-count">ענית על ${answered} מתוך 20 שאלות</span><button class="primary" id="submit-test">סיימתי, בדקי לי ✓</button></div>`;}
function printView(){return `<div class="print-only"><h1>מתמטיקה, צעד צעד</h1><p>דף חזרה למבדק · עשרה נושאים בחשבון ובגאומטריה</p><p>קראי את ההסבר, פתרי את השאלות על דף ורק בסוף בדקי מול התשובות.</p>${lessons.map((l,i)=>`<section class="print-lesson"><h2>${i+1}. ${l.title}</h2><p>${l.goal}</p>${stepsHTML(l)}<div class="tip"><strong>שימי לב:</strong> ${l.tip.includes('<')?l.tip:mathProse(l.tip)}</div><h3 style="margin-top:24px">מנסות לבד</h3>${l.questions.map((question,j)=>`<div class="print-q">${j+1}. ${question.prompt}${question.options?`<div class="small">${question.options.map(esc).join(' / ')}</div>`:'<div>תשובה: __________________</div>'}</div>`).join('')}</section>`).join('')}<section class="print-lesson"><h2>תשובות והסברים — בודקות רק אחרי שפתרת</h2>${lessons.map((l)=>`<h3>${l.title}</h3>${l.questions.map((question,j)=>`<p class="print-answer">${j+1}. <strong>${answerDisplay(question)}</strong> — ${question.explain}</p>`).join('')}`).join('')}</section></div>`;}
function render(){const route=location.hash||'#home';if(route!==lastRoute){currentTab='learn';lastRoute=route;}let body;if(route.startsWith('#lesson/')){const l=lessons.find(l=>l.id===route.split('/')[1]);body=l?lessonView(l):home();}else body=route==='#test'?testView():home();document.getElementById('app').innerHTML=`<div class="no-print">${!storageWorks?'<div class="save-notice" role="status">הדפדפן לא מאפשר שמירת התקדמות כרגע. אפשר ללמוד ולתרגל, אך סגירת הדף עלולה למחוק את ההתקדמות.</div>':''}${body}</div>`;initLab();}
function updateQuestion(id){const node=document.getElementById(`q-${id}`);if(!node)return;const l=lessons.find(l=>l.id===id.slice(0,id.lastIndexOf('-'))),index=+id.slice(id.lastIndexOf('-')+1);node.outerHTML=questionHTML(id,l.questions[index],index+1,'practice');}
function testCount(){const e=state.exam,el=document.getElementById('answered-count');if(e&&el)el.textContent=`ענית על ${e.ids.filter(id=>answerValid(getQ(id),e.answers[id]||'')).length} מתוך 20 שאלות`;}
function recordAnswer(id,mode,raw){if(mode==='test'){state.exam.answers[id]=raw;save();testCount();}else drafts[id]=raw;}
document.addEventListener('input',event=>{const t=event.target;if(t.matches('[data-answer]')){recordAnswer(t.dataset.answer,t.dataset.mode,t.value);const err=document.getElementById(`error-${t.dataset.answer}`);if(err)err.textContent='';}if(t.closest('.lab'))initLab();});document.addEventListener('change',event=>{if(event.target.closest('.lab'))initLab();});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('[data-answer][data-mode="practice"]')){event.preventDefault();document.querySelector(`[data-check="${event.target.dataset.answer}"]`)?.click();}});
document.addEventListener('click',event=>{const t=event.target.closest('button');if(!t)return;
if(t.dataset.tab){currentTab=t.dataset.tab;render();return;}
if(t.dataset.read){state.read[t.dataset.read]=true;save();currentTab='practice';render();window.scrollTo({top:0,behavior:'smooth'});return;}
if(t.dataset.option){const id=t.dataset.option,question=getQ(id),raw=question.options[+t.dataset.choice];selections[id]=raw;recordAnswer(id,t.dataset.mode,raw);const card=t.closest('.q-card');card.querySelectorAll('.option').forEach((b,i)=>{const selected=i===+t.dataset.choice;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});document.getElementById(`error-${id}`).textContent='';return;}
if(t.dataset.check){const id=t.dataset.check,question=getQ(id),raw=question.options?(selections[id]??drafts[id]??state.practice[id]?.raw??''):(document.querySelector(`[data-answer="${id}"]`)?.value??'');if(!answerValid(question,raw)){document.getElementById(`error-${id}`).textContent=question.options?'בחרי תשובה לפני הבדיקה.':'כתבי מספר, שבר כמו 3/4, או מספר מעורב כמו 1 1/2.';return;}state.practice[id]={raw,correct:isCorrect(question,raw),tries:(state.practice[id]?.tries||0)+1};drafts[id]=raw;save();updateQuestion(id);return;}
if(t.dataset.reveal){const id=t.dataset.reveal;state.practice[id]={raw:drafts[id]||'',correct:false,revealed:true};save();updateQuestion(id);return;}
if(t.dataset.retry){const id=t.dataset.retry;delete state.practice[id];delete drafts[id];delete selections[id];save();updateQuestion(id);return;}
if(t.id==='start-test'||t.id==='new-test'){newExam();render();window.scrollTo({top:0,behavior:'smooth'});return;}
if(t.id==='submit-test'){const missing=state.exam.ids.filter(id=>!answerValid(getQ(id),state.exam.answers[id]||''));if(missing.length){document.getElementById('test-error').textContent=`נשארו ${missing.length} שאלות ללא תשובה תקינה. השלימי אותן כדי לראות את התוצאות.`;const card=document.getElementById(`q-${missing[0]}`);document.getElementById(`error-${missing[0]}`).textContent='כאן צריך לבחור תשובה או להקליד מספר תקין.';card.scrollIntoView({behavior:'smooth',block:'center'});card.querySelector('input,button')?.focus({preventScroll:true});return;}state.exam.submitted=true;save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
if(t.id==='print'){document.getElementById('print-content')?.remove();const el=document.createElement('div');el.id='print-content';el.innerHTML=printView();document.getElementById('app').append(el);window.print();return;}
if(t.id==='reset'){document.getElementById('reset-dialog').showModal();return;}if(t.id==='cancel-reset'){document.getElementById('reset-dialog').close();return;}if(t.id==='confirm-reset'){state={read:{},practice:{}};drafts={};selections={};save();document.getElementById('reset-dialog').close();render();}
});window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});render();

  function textInto(el,text){el.replaceChildren();for(const line of text.split('\n')){if(!line.trim())continue;const p=document.createElement('p');p.textContent=line;p.style.margin='7px 0';if(/^[\d\s.,/×÷+−=()°<>:?-]+$/.test(line)){p.dir='ltr';p.className='math';p.style.display='block';}el.append(p);}}
  function drawResult(id){const container=document.querySelector(`[data-ai-result="${id}"]`);if(!container)return;const item=cache.get(id);container.hidden=!item;if(!item)return;container.className='ai-result'+(item.error?' ai-result-error':'');textInto(container,item.text);}
  function controls(){document.querySelectorAll('.q-card').forEach(card=>{const check=card.querySelector('[data-check]');if(!check||card.querySelector('.ai-tools'))return;const id=check.dataset.check;const el=document.createElement('section');el.className='ai-tools';el.setAttribute('aria-label','עזרת AI לתרגיל');for(const [mode,label]of [['hint','✨ תני לי רמז'],['explain','🦄 הסבירי בדרך אחרת']]){const b=document.createElement('button');b.type='button';b.className='secondary ai-request';b.dataset.aiQuestion=id;b.dataset.aiMode=mode;b.textContent=label;b.disabled=busy;el.append(b);}const result=document.createElement('div');result.dataset.aiResult=id;result.className='ai-result';result.setAttribute('role','status');result.hidden=true;el.append(result);const note=document.createElement('small');note.textContent='הסבר שנוצר באמצעות AI. את הבדיקה המדויקת והפתרון המובנה תמצאי למעלה.';el.append(note);card.append(el);drawResult(id);});}
  function showPane(name){document.querySelectorAll('[data-ai-pane]').forEach(el=>{el.hidden=el.dataset.aiPane!==name;});document.querySelectorAll('[data-ai-tab]').forEach(el=>{el.setAttribute('aria-selected',String(el.dataset.aiTab===name));});message('');}
  function openDialog(){const dialog=$('ai-dialog');if(!dialog.open)dialog.showModal();updateStatus();}
  function showFamilyCodes(parent,child){lastChildCode=child;$('ai-codes').hidden=false;$('ai-parent-code-output').value=parent||'השתמשו בקוד ההורים שכבר שמרתם';$('ai-child-code-output').value=child;}
  function childLink(){return location.origin+location.pathname+'#connect='+encodeURIComponent(lastChildCode);}
  async function copy(text){try{await navigator.clipboard.writeText(text);message('הועתק.');}catch{message('ההעתקה האוטומטית חסומה. אפשר לסמן את הקוד או הקישור ולהעתיק ידנית.');}}
  function init(){const button=document.createElement('button');button.type='button';button.id='ai-open';button.className='ai-nav-button';button.textContent='🦄 עזרת AI';document.querySelector('header nav').append(button);
    const dialog=document.createElement('dialog');dialog.id='ai-dialog';dialog.dir='rtl';dialog.innerHTML=`<div class="ai-dialog-head"><h2>קצת עזרה מהמורה 🦄</h2><button type="button" class="text-btn" id="ai-close">סגירה</button></div><p id="ai-connection-state"></p><div class="ai-dialog-tabs" role="tablist" aria-label="חיבור משפחתי"><button type="button" role="tab" aria-selected="true" data-ai-tab="student">חיבור ללמידה</button><button type="button" role="tab" aria-selected="false" data-ai-tab="parent">אזור הורים</button></div><section data-ai-pane="student"><p>לכל משפחה יש חיבור משלה. הדביקי כאן את הקוד שקיבלת מהורה.</p><form id="ai-pair-form"><label for="ai-child-code">קוד משפחתי</label><input id="ai-child-code" type="text" dir="ltr" autocomplete="off" spellcheck="false" required><button class="primary" type="submit">חברי אותי למשפחה</button></form><button id="ai-disconnect" class="text-btn" type="button" hidden>ניתוק המשפחה מהמכשיר הזה</button></section><section data-ai-pane="parent" hidden><p class="small">הורה מגדיר פעם אחת מפתח API ייעודי. החיוב הוא בחשבון ה־API של המשפחה, בנפרד ממנוי ChatGPT. המפתח נשלח לשרת האתר ונשמר בו מוצפן; הוא אינו נשמר בדפדפן.</p><p class="small">ה־AI מקבל רק תרגילים ופתרונות מתוך חומר הלימוד. אין כאן צ׳אט חופשי ואין שליחה של שמות, פרטי קשר או תשובות הילדה ל־OpenAI.</p><details open><summary>חיבור משפחה חדשה</summary><form id="ai-create-form"><label for="ai-api-key">מפתח API ייעודי של OpenAI</label><input id="ai-api-key" type="password" dir="ltr" autocomplete="new-password" spellcheck="false" required placeholder="sk-…"><label class="ai-consent"><input type="checkbox" id="ai-adult-consent" required><span>אני הורה ומאשר/ת לשמור את המפתח בשרת האתר ולהשתמש בו לקבלת הסברי AI לפי בקשה. ידוע לי שהשימוש עשוי להיות כרוך בתשלום.</span></label><button class="primary" type="submit">יצירת חיבור משפחתי</button></form><p class="small"><a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer" class="inline-link">יצירת מפתח בחשבון OpenAI</a>. המפתח צריך לאפשר Responses ו־Moderations וגישה למודל שהגדיר מפעיל האתר.</p></details><details><summary>ניהול משפחה קיימת</summary><form id="ai-parent-form"><label for="ai-parent-code">קוד ההורים ששמרתם</label><input type="password" id="ai-parent-code" dir="ltr" autocomplete="off" required><button class="secondary" type="submit">כניסה להגדרות המשפחה</button></form><div id="ai-parent-actions" hidden><p id="ai-usage"></p><label for="ai-new-key">החלפת מפתח API</label><input id="ai-new-key" type="password" dir="ltr" autocomplete="new-password" spellcheck="false"><div class="actions"><button type="button" class="secondary" id="ai-replace-key">שמירת המפתח החדש</button><button type="button" class="secondary" id="ai-rotate-child">קוד ילדים חדש וניתוק מכשירים</button><button type="button" class="text-btn" id="ai-delete-family">מחיקת החיבור המשפחתי</button></div></div></details><section class="ai-codes" id="ai-codes" hidden><h3>שמרו את קוד ההורים</h3><p class="small">קוד ההורים מאפשר להחליף מפתח ולמחוק את החיבור. שמרו אותו אצלכם, ושתפו עם הילדים רק את הקוד המשפחתי או את קישור הלמידה.</p><label for="ai-parent-code-output">קוד הורים — לניהול בלבד</label><input id="ai-parent-code-output" readonly dir="ltr"><button type="button" class="text-btn" id="ai-copy-parent">העתקת קוד ההורים</button><label for="ai-child-code-output">קוד משפחתי — לילדים</label><input id="ai-child-code-output" readonly dir="ltr"><div class="actions"><button type="button" class="secondary" id="ai-copy-child">העתקת קוד משפחתי</button><button type="button" class="secondary" id="ai-copy-link">העתקת קישור למחשב אחר</button></div><label for="ai-child-link-output">קישור הלמידה</label><input id="ai-child-link-output" readonly dir="ltr"></section></section><div id="ai-form-message" role="status" aria-live="polite"></div>`;document.body.append(dialog);
    const styleNotice=document.createElement('p');styleNotice.className='small';styleNotice.textContent='אפשר להמשיך ללמוד ולתרגל גם בלי חיבור AI.';dialog.append(styleNotice);
    $('ai-open').addEventListener('click',openDialog);$('ai-close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('close',()=>{parentCode='';lastChildCode='';$('ai-parent-actions').hidden=true;$('ai-codes').hidden=true;for(const id of ['ai-api-key','ai-new-key','ai-parent-code','ai-parent-code-output','ai-child-code-output','ai-child-link-output'])$(id).value='';showPane('student');});
    document.querySelectorAll('[data-ai-tab]').forEach(b=>b.addEventListener('click',()=>showPane(b.dataset.aiTab)));
    $('ai-disconnect').addEventListener('click',()=>{setSession(null);message('החיבור נותק מהמכשיר הזה. ההתקדמות בתרגול נשארה.');});
    $('ai-pair-form').addEventListener('submit',event=>formAction(event,async()=>{const code=$('ai-child-code').value.trim();const value=await call('/api/pair',{childCode:code});setSession(value);$('ai-child-code').value='';message('החיבור הצליח. אפשר לסגור ולבקש רמז בתרגול.');}));
    $('ai-create-form').addEventListener('submit',event=>formAction(event,async()=>{const key=$('ai-api-key').value.trim();try{const result=await call('/api/families',{apiKey:key,adultConsent:$('ai-adult-consent').checked});parentCode=result.parentCode;showFamilyCodes(parentCode,result.childCode);$('ai-child-link-output').value=childLink();setSession({sessionToken:result.sessionToken,expiresAt:result.expiresAt});message('המפתח נשמר. הרשאותיו והיתרה ייבדקו בבקשת ה־AI הראשונה. שמרו עכשיו את קוד ההורים.');}finally{$('ai-api-key').value='';}}));
    $('ai-parent-form').addEventListener('submit',event=>formAction(event,async()=>{const token=$('ai-parent-code').value.trim();const status=await call('/api/parent',{action:'status'},token);parentCode=token;$('ai-parent-code').value='';$('ai-parent-actions').hidden=false;$('ai-usage').textContent=`בקשות היום: ${status.usedToday} מתוך ${status.dailyLimit}. מודל: ${status.model}. המגבלה היא על מספר בקשות, ולא תקרת הוצאה כספית.`;message('הגדרות המשפחה פתוחות.');}));
    $('ai-replace-key').addEventListener('click',()=>buttonAction($('ai-replace-key'),async()=>{try{await call('/api/parent',{action:'replaceKey',apiKey:$('ai-new-key').value.trim()},parentCode);message('המפתח הוחלף. הוא ייבדק בבקשת ה־AI הבאה.');}finally{$('ai-new-key').value='';}}));
    $('ai-rotate-child').addEventListener('click',()=>buttonAction($('ai-rotate-child'),async()=>{if(!confirm('ליצור קוד חדש ולנתק את כל מכשירי הלמידה של המשפחה?'))return;const result=await call('/api/parent',{action:'rotateChild'},parentCode);showFamilyCodes('',result.childCode);$('ai-child-link-output').value=childLink();setSession(null);message('קוד חדש נוצר. יש לחבר מחדש כל מכשיר למידה.');}));
    $('ai-delete-family').addEventListener('click',()=>buttonAction($('ai-delete-family'),async()=>{if(!confirm('למחוק את המפתח השמור ואת כל חיבורי הלמידה של המשפחה? הפעולה אינה מוחקת את התקדמות התרגול המקומית.'))return;await call('/api/parent',{action:'delete'},parentCode);parentCode='';lastChildCode='';$('ai-parent-actions').hidden=true;$('ai-codes').hidden=true;setSession(null);message('החיבור המשפחתי והמפתח השמור נמחקו.');}));
    $('ai-copy-parent').addEventListener('click',()=>copy(parentCode));$('ai-copy-child').addEventListener('click',()=>copy(lastChildCode));$('ai-copy-link').addEventListener('click',()=>copy(childLink()));
    document.addEventListener('click',async event=>{const b=event.target.closest('[data-ai-question]');if(!b||busy)return;if(!session){openDialog();showPane('student');return;}busy=true;document.querySelectorAll('.ai-request').forEach(x=>x.disabled=true);const id=b.dataset.aiQuestion;cache.set(id,{text:'🦄 המורה מכינה הסבר. זה יכול לקחת מעט זמן…'});drawResult(id);try{const result=await call('/api/tutor',{questionId:id,mode:b.dataset.aiMode},session.sessionToken);cache.set(id,{text:result.text});}catch(error){cache.set(id,{text:error.name==='TimeoutError'?'הבקשה ארכה יותר מדי זמן. אפשר לנסות שוב.':error.message||'אין חיבור כרגע. נסי שוב מאוחר יותר.',error:true});}finally{busy=false;document.querySelectorAll('.ai-request').forEach(x=>x.disabled=false);drawResult(id);}});
    new MutationObserver(controls).observe($('app'),{childList:true,subtree:true});controls();updateStatus();pairFromLink();window.addEventListener('hashchange',pairFromLink);
  }
  async function buttonAction(button,action){button.disabled=true;message('ממתינים לתשובה…');try{await action();}catch(error){message(error.message||'הפעולה לא הושלמה. בדקו חיבור ונסו שוב.',true);}finally{button.disabled=false;}}
  function formAction(event,action){event.preventDefault();return buttonAction(event.target.querySelector('button[type="submit"]'),action);}
  function pairFromLink(){const match=location.hash.match(/^#connect=(c_[A-Za-z0-9_-]{43})$/);if(!match)return;openDialog();showPane('student');$('ai-child-code').value=match[1];history.replaceState(null,'',location.pathname+'#home');}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script></body></html>
